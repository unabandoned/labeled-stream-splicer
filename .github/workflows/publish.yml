name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@08dd058141c711279e7c990179d2bfce0329ebc1 # main
    with:
      install-for-publish: false
    secrets: inherit
